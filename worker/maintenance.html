<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preparando algo para ti — mrmerlo.com</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140F12">
<!-- Favicon: corazón pixelado -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-0.5 -1 10 10' shape-rendering='crispEdges'%3E%3Cpath fill='%23FF4D6D' d='M1 0h2v1H1zM6 0h2v1H6zM0 1h4v1H0zM5 1h4v1H5zM0 2h9v2H0zM1 4h7v1H1zM2 5h5v1H2zM3 6h3v1H3zM4 7h1v1H4z'/%3E%3Crect x='1' y='1' width='1' height='1' fill='%23FFE3E8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<!-- Oculta la escena hasta que GSAP la prepara (sin destellos). Con movimiento
     reducido o si algo falla, todo aparece estático. -->
<script>
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.className = 'pre';
  setTimeout(function () { document.documentElement.className = ''; }, 3500);
</script>
<style>
  :root {
    --bg:#140F12; --cream:#FFF3E8; --mut:#CBBBB0; --line:#3B2B31;
    --h:#FF4D6D; --hl:#FF8FA3; --hs:#C9184A; --spark:#FFE3E8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background: radial-gradient(ellipse 70% 60% at 50% 38%, #2B1A21 0%, var(--bg) 70%);
    color:var(--cream);
    font-family:Nunito, system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow:hidden;
    display:grid; place-items:center;
    padding:24px;
  }

  #sky { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .mini { position:absolute; bottom:-40px; height:auto; shape-rendering:crispEdges; }

  .card { position:relative; z-index:1; max-width:1000px; text-align:center;
          display:flex; flex-direction:column; align-items:center; }

  .heartBtn { background:none; border:0; cursor:pointer; padding:14px; margin-bottom:26px;
              border-radius:28px; -webkit-tap-highlight-color:transparent; }
  .heartBtn:focus-visible { outline:3px solid var(--hl); outline-offset:6px; }
  #heart { width:clamp(128px, 19vw, 208px); height:auto; display:block; overflow:visible; shape-rendering:crispEdges; }

  h1 {
    font-family:'Luckiest Guy', system-ui, sans-serif; font-weight:400;
    font-size:clamp(40px, 6.6vw, 86px); line-height:.98; letter-spacing:.015em;
    color:var(--cream);
    text-shadow:0 .075em 0 var(--hs);
    margin-bottom:24px;
  }
  h1 .ch { will-change:transform; }

  .sub { font-size:clamp(16px, 2vw, 19px); line-height:1.65; color:var(--mut); max-width:36ch; margin-bottom:28px; }

  .contact { display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap;
             font-weight:700; font-size:15px; }
  .contact .lbl { margin-right:6px; }
  .contact a { color:var(--cream); text-decoration:none; padding:10px 18px; border-radius:999px;
               border:2px solid var(--line); transition:border-color .2s, background .2s, transform .2s; }
  .contact a:hover, .contact a:focus-visible { border-color:var(--h); background:rgba(255,77,109,.12);
               transform:translateY(-2px); outline:none; }

  footer { position:fixed; left:0; right:0; bottom:22px; z-index:1; display:flex; justify-content:center;
           gap:20px; flex-wrap:wrap; font-size:13px; color:var(--mut); }
  footer svg { width:12px; height:11px; vertical-align:-1px; shape-rendering:crispEdges; }

  .pop { position:absolute; left:50%; top:0; transform:translateX(-50%);
         font-family:'Luckiest Guy', system-ui, sans-serif; font-size:24px; color:var(--hl);
         pointer-events:none; white-space:nowrap; opacity:0; }

  .pre .card, .pre footer { visibility:hidden; }

  @media (max-height: 660px) {
    #heart { width:104px; } .heartBtn { margin-bottom:12px; }
    h1 { font-size:clamp(36px, 7vw, 70px); margin-bottom:14px; } .sub { margin-bottom:18px; }
    footer { display:none; }
  }
</style>
</head>
<body>
  <div id="sky" aria-hidden="true"></div>

  <main class="card">
    <button class="heartBtn" type="button" aria-label="Darle cariño al corazón" data-i-label="heart">
      <svg id="heart" viewBox="0 0 9 8" aria-hidden="true"><g id="beat"></g></svg>
    </button>
    <span class="pop" aria-hidden="true" data-i="thanks">¡Gracias!</span>

    <h1 data-i="title">Estoy preparando<br>algo para ti</h1>
    <p class="sub" data-i="sub">Gracias por pasarte. Estoy renovando el sitio con proyectos nuevos y lo tendré listo muy pronto.</p>

    <p class="contact">
      <span class="lbl" data-i="write">Escríbeme</span>
      <a href="mailto:marcosrodriguezmerlo@gmail.com" data-i="mail">Correo</a>
      <a href="https://wa.me/18295870648" rel="noopener">WhatsApp</a>
    </p>
  </main>

  <footer>
    <span><span data-i="made">Hecho con</span>
      <svg viewBox="0 0 9 8" aria-label="amor" role="img"><path fill="#FF4D6D" d="M1 0h2v1H1zM6 0h2v1H6zM0 1h4v1H0zM5 1h4v1H5zM0 2h9v2H0zM1 4h7v1H1zM2 5h5v1H2zM3 6h3v1H3zM4 7h1v1H4z"/></svg>
      <span data-i="place">en Santo Domingo</span></span>
    <span data-i="hint">Toca el corazón</span>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Physics2DPlugin.min.js"></script>
<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var HEART_PATH = 'M1 0h2v1H1zM6 0h2v1H6zM0 1h4v1H0zM5 1h4v1H5zM0 2h9v2H0zM1 4h7v1H1zM2 5h5v1H2zM3 6h3v1H3zM4 7h1v1H4z';

  /* ── Idioma: español por defecto, inglés si el navegador lo prefiere ── */
  var en = (navigator.language || '').toLowerCase().indexOf('en') === 0;
  if (en) {
    document.documentElement.lang = 'en';
    document.title = 'Making something for you — mrmerlo.com';
    var T = {
      title: 'I’m making<br>something for you',
      sub: 'Thanks for stopping by. I’m refreshing the site with new projects, and it’ll be ready very soon.',
      write: 'Write to me', mail: 'Email', made: 'Made with', place: 'in Santo Domingo',
      hint: 'Tap the heart', thanks: 'Thank you!'
    };
    document.querySelectorAll('[data-i]').forEach(function (n) {
      var k = n.getAttribute('data-i');
      if (k === 'title') n.innerHTML = T.title; else if (T[k]) n.textContent = T[k];
    });
    document.querySelector('.heartBtn').setAttribute('aria-label', 'Give the heart some love');
  }

  /* ── El corazón: un píxel = una celda del viewBox ── */
  var MAP = [
    '.HX...XX.',
    'HWXX.XXXX',
    'HXXXXXXXX',
    'XXXXXXXXS',
    '.XXXXXXS.',
    '..XXXXS..',
    '...XXS...',
    '....S....'
  ];
  var COLOR = { H: '#FF8FA3', W: '#FFE3E8', X: '#FF4D6D', S: '#C9184A' };
  var beatG = document.getElementById('beat');
  var px = [];
  MAP.forEach(function (row, y) {
    for (var x = 0; x < row.length; x++) {
      var c = row[x];
      if (c === '.') continue;
      var r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', x); r.setAttribute('y', y);
      r.setAttribute('width', 1.02); r.setAttribute('height', 1.02);
      r.setAttribute('fill', COLOR[c]);
      beatG.appendChild(r);
      px.push({ el: r, x: x + 0.5, y: y + 0.5 });
    }
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var gsap = window.gsap;
  if (!gsap || !window.SplitText || !window.Physics2DPlugin || reduce) {
    document.documentElement.className = '';
    return; // estático y completo
  }
  gsap.registerPlugin(SplitText, Physics2DPlugin);
  var R = gsap.utils.random;
  var els = px.map(function (p) { return p.el; });

  // Píxeles dispersos antes de armarse
  els.forEach(function (el) {
    gsap.set(el, { x: R(-15, 15), y: R(-13, 9), rotation: R(-200, 200), opacity: 0, transformOrigin: '50% 50%' });
  });

  /* ── Corazoncitos que suben con cada latido ── */
  var sky = document.getElementById('sky');
  var alive = 0;
  function spawnMini() {
    if (alive > 12 || document.hidden) return;
    var s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '0 0 9 8');
    s.setAttribute('class', 'mini');
    var size = R(12, 30);
    s.style.width = size + 'px';
    s.style.left = R(4, 96) + '%';
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', HEART_PATH);
    p.setAttribute('fill', Math.random() < 0.65 ? '#FF4D6D' : '#FF8FA3');
    s.appendChild(p);
    sky.appendChild(s);
    alive++;
    var dur = R(7, 11);
    var peak = R(0.16, 0.42);
    gsap.set(s, { opacity: 0, rotation: R(-18, 18) });
    gsap.to(s, { y: -(window.innerHeight + 90), duration: dur, ease: 'none',
      onComplete: function () { s.remove(); alive--; } });
    gsap.to(s, { opacity: peak, duration: 1.4 });
    gsap.to(s, { opacity: 0, duration: 1.6, delay: dur - 1.8 });
    gsap.to(s, { x: '+=' + R(-46, 46), duration: R(1.6, 2.4), ease: 'sine.inOut', yoyo: true, repeat: Math.ceil(dur / 2) });
  }

  /* ── Latido (lub-dub) ── */
  var beat = gsap.timeline({ paused: true, repeat: -1, repeatDelay: 0.9 })
    .call(spawnMini)
    .to(beatG, { scale: 1.13, duration: 0.12, ease: 'power2.out', transformOrigin: '50% 55%' })
    .to(beatG, { scale: 1, duration: 0.17, ease: 'power2.in' })
    .to(beatG, { scale: 1.07, duration: 0.11, ease: 'power2.out' })
    .to(beatG, { scale: 1, duration: 0.38, ease: 'power3.out' });

  /* ── Tocar el corazón: estalla en píxeles y se vuelve a armar ── */
  var btn = document.querySelector('.heartBtn');
  var pop = document.querySelector('.pop');
  var busy = false;
  btn.addEventListener('click', function () {
    if (busy) return;
    busy = true;
    beat.pause();
    gsap.to(beatG, { scale: 1, duration: 0.1 });

    gsap.fromTo(pop, { y: 0, opacity: 0, scale: 0.6 },
      { y: -46, opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(2.5)',
        onComplete: function () { gsap.to(pop, { y: -70, opacity: 0, duration: 0.6, delay: 0.5 }); } });
    for (var k = 0; k < 4; k++) gsap.delayedCall(k * 0.12, spawnMini);

    var tl = gsap.timeline({ onComplete: function () { busy = false; beat.restart(); } });
    px.forEach(function (p) {
      var ang = Math.atan2(p.y - 3.6, p.x - 4.5) * 180 / Math.PI;
      tl.to(p.el, {
        duration: 0.8, ease: 'none',
        physics2D: { velocity: R(16, 32), angle: ang + R(-28, 28) - 18, gravity: 42 },
        rotation: R(-360, 360)
      }, 0);
    });
    tl.to(els, { x: 0, y: 0, rotation: 0, duration: 1, ease: 'elastic.out(1, 0.55)',
      stagger: { each: 0.012, from: 'random' } }, 0.82);
  });

  /* El corazón "mira" el puntero: se inclina un poco hacia él */
  var tilt = gsap.quickTo('#heart', 'rotation', { duration: 0.8, ease: 'power3.out' });
  window.addEventListener('pointermove', function (e) {
    tilt((e.clientX / window.innerWidth - 0.5) * 12);
  });

  /* ── Intro (tras cargar las fuentes, para partir bien las letras) ── */
  function start() {
    var split = SplitText.create('h1', { type: 'chars,words', charsClass: 'ch' });
    var tl = gsap.timeline();
    tl.call(function () { document.documentElement.className = ''; }, null, 0);
    tl.to(els, { x: 0, y: 0, rotation: 0, opacity: 1, duration: 1.15, ease: 'back.out(1.7)',
      stagger: { each: 0.022, from: 'random' } }, 0.05);
    tl.from(split.chars, { yPercent: -140, rotation: function () { return R(-28, 28); }, opacity: 0,
      duration: 1, ease: 'elastic.out(1, 0.5)', stagger: 0.035 }, 0.35);
    tl.from(['.sub', '.contact', 'footer'], { y: 18, opacity: 0, duration: 0.8, ease: 'power3.out', stagger: 0.1 }, 0.95);
    tl.add(function () { beat.play(0); });

    // Cada letra rebota al pasar por encima
    split.chars.forEach(function (ch) {
      ch.addEventListener('pointerenter', function () {
        if (gsap.isTweening(ch)) return;
        gsap.timeline()
          .to(ch, { y: -16, rotation: R(-16, 16), duration: 0.16, ease: 'power2.out' })
          .to(ch, { y: 0, rotation: 0, duration: 0.8, ease: 'elastic.out(1, 0.32)' });
      });
    });
  }

  var started = false;
  function go() { if (!started) { started = true; start(); } }
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(go);
  setTimeout(go, 2500);
})();
</script>
</body>
</html>
